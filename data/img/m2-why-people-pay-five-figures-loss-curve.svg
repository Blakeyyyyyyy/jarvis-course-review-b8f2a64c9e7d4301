<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="'Instrument Sans', Arial, sans-serif">
  <rect width="1200" height="640" fill="#ffffff"/>
  <text x="60" y="58" font-family="'Fraunces', Georgia, serif" font-size="30" font-weight="600" fill="#0e1016">The same ten thousand dollars does not feel the same</text>
  <text x="60" y="92" font-size="20" fill="#5a5d6b">Prospect theory, Kahneman and Tversky, 1979. A loss weighs roughly twice as much as an equal gain.</text>
  <!-- axes -->
  <line x1="600" y1="140" x2="600" y2="580" stroke="#e6e7ec" stroke-width="1.5"/>
  <line x1="140" y1="380" x2="1080" y2="380" stroke="#e6e7ec" stroke-width="1.5"/>
  <text x="1060" y="410" font-family="'IBM Plex Mono', Menlo, monospace" font-size="16" fill="#8b8e9c" text-anchor="end">GAINS</text>
  <text x="160" y="410" font-family="'IBM Plex Mono', Menlo, monospace" font-size="16" fill="#8b8e9c">LOSSES</text>
  <text x="612" y="160" font-family="'IBM Plex Mono', Menlo, monospace" font-size="16" fill="#8b8e9c">HOW IT FEELS</text>
  <!-- gain side: gentle -->
  <path d="M600 380 C 700 330, 820 300, 1060 285" fill="none" stroke="#4b2fc4" stroke-width="3" stroke-linecap="round"/>
  <!-- loss side: steep -->
  <path d="M600 380 C 560 440, 480 520, 300 570" fill="none" stroke="#8a6210" stroke-width="3" stroke-linecap="round"/>
  <!-- gain marker -->
  <line x1="840" y1="380" x2="840" y2="300" stroke="#4b2fc4" stroke-width="1.5" stroke-dasharray="5 5"/>
  <circle cx="840" cy="300" r="7" fill="#4b2fc4"/>
  <rect x="760" y="210" width="260" height="66" rx="10" fill="#efecfb"/>
  <text x="890" y="238" font-size="18" fill="#0e1016" text-anchor="middle" font-weight="600">Save $10k a year</text>
  <text x="890" y="262" font-size="16" fill="#5a5d6b" text-anchor="middle">nice to have</text>
  <!-- loss marker -->
  <line x1="360" y1="380" x2="360" y2="556" stroke="#8a6210" stroke-width="1.5" stroke-dasharray="5 5"/>
  <circle cx="360" cy="556" r="7" fill="#8a6210"/>
  <rect x="110" y="415" width="260" height="66" rx="10" fill="#f8f1df"/>
  <text x="240" y="443" font-size="18" fill="#0e1016" text-anchor="middle" font-weight="600">Losing $10k a year</text>
  <text x="240" y="467" font-size="16" fill="#5a5d6b" text-anchor="middle">has to stop</text>
  <text x="600" y="618" font-size="17" fill="#8b8e9c" text-anchor="middle">Same number. The loss side is steeper, so it moves people. Simplified curve, for teaching.</text>
</svg>

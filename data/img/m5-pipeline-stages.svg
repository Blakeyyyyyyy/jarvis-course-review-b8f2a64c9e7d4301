<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" font-family="Instrument Sans, Helvetica, Arial, sans-serif">
  <style>
    .stage{fill:#efecfb;stroke:#4b2fc4;stroke-width:2;rx:10}
    .end{fill:#f8f1df;stroke:#8a6210;stroke-width:2}
    .t{font-size:18px;fill:#0e1016;text-anchor:middle}
    .s{font-size:13px;fill:#5a5d6b;text-anchor:middle}
    .arrow{stroke:#8b8e9c;stroke-width:2;fill:none;marker-end:url(#a)}
    .cap{font-size:14px;fill:#5a5d6b}
  </style>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8b8e9c"/></marker></defs>
  <g>
    <rect class="stage" x="20" y="60" width="150" height="70" rx="10"/><text class="t" x="95" y="90">New lead</text><text class="s" x="95" y="112">ad, booking, outreach</text>
    <rect class="stage" x="210" y="60" width="150" height="70" rx="10"/><text class="t" x="285" y="90">Contacted</text><text class="s" x="285" y="112">first reply or call</text>
    <rect class="stage" x="400" y="60" width="150" height="70" rx="10"/><text class="t" x="475" y="90">Call 1 booked</text><text class="s" x="475" y="112">set by the calendar</text>
    <rect class="stage" x="590" y="60" width="150" height="70" rx="10"/><text class="t" x="665" y="90">Call 1 done</text><text class="s" x="665" y="112">problem has a number</text>
    <rect class="stage" x="780" y="60" width="150" height="70" rx="10"/><text class="t" x="855" y="90">Proposal sent</text><text class="s" x="855" y="112">Jarvis drafts it</text>
    <rect class="stage" x="970" y="60" width="150" height="70" rx="10"/><text class="t" x="1045" y="90">Call 2 booked</text><text class="s" x="1045" y="112">the close</text>
    <path class="arrow" d="M170 95 L208 95"/><path class="arrow" d="M360 95 L398 95"/><path class="arrow" d="M550 95 L588 95"/><path class="arrow" d="M740 95 L778 95"/><path class="arrow" d="M930 95 L968 95"/>
    <path class="arrow" d="M1045 130 L1045 170"/>
    <rect class="end" x="780" y="180" width="150" height="60" rx="10"/><text class="t" x="855" y="216">Won</text>
    <rect class="end" x="970" y="180" width="150" height="60" rx="10"/><text class="t" x="1045" y="216">Lost</text>
    <rect class="end" x="590" y="180" width="150" height="60" rx="10"/><text class="t" x="665" y="216">Not now</text>
    <path class="arrow" d="M1030 170 L900 182"/><path class="arrow" d="M1020 170 L760 186"/>
    <text class="cap" x="20" y="275">Nine stages, fixed. Every lead sits in exactly one. Jarvis moves them, you read the board.</text>
  </g>
</svg>

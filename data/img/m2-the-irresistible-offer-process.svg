<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="'Instrument Sans', Arial, sans-serif">
  <rect width="1200" height="420" fill="#ffffff"/>
  <text x="60" y="58" font-family="'Fraunces', Georgia, serif" font-size="30" font-weight="600" fill="#0e1016">Creating the irresistible offer is a process</text>
  <text x="60" y="92" font-size="20" fill="#5a5d6b">It runs in one direction. Each step has its own lesson in this module.</text>
  <g>
    <rect x="60" y="150" width="320" height="170" rx="10" fill="#efecfb" stroke="#4b2fc4" stroke-width="1.5"/>
    <text x="84" y="190" font-family="'IBM Plex Mono', Menlo, monospace" font-size="16" fill="#4b2fc4" letter-spacing="2">STEP 1</text>
    <text x="84" y="226" font-size="24" font-weight="600" fill="#0e1016">Find the underserved niche</text>
    <text x="84" y="258" font-size="18" fill="#5a5d6b">Passes all five tests. Same loss repeats.</text>
    <text x="84" y="298" font-size="17" fill="#8a6210">Lesson: Find the Underserved Markets</text>
  </g>
  <path d="M380 235 L436 235" stroke="#8b8e9c" stroke-width="1.5" fill="none"/>
  <path d="M428 227 L440 235 L428 243" stroke="#8b8e9c" stroke-width="1.5" fill="none"/>
  <g>
    <rect x="440" y="150" width="320" height="170" rx="10" fill="#ffffff" stroke="#4b2fc4" stroke-width="1.5"/>
    <text x="464" y="190" font-family="'IBM Plex Mono', Menlo, monospace" font-size="16" fill="#4b2fc4" letter-spacing="2">STEP 2</text>
    <text x="464" y="226" font-size="24" font-weight="600" fill="#0e1016">Find the service they desire</text>
    <text x="464" y="258" font-size="18" fill="#5a5d6b">What a human does today that a system could.</text>
    <text x="464" y="298" font-size="17" fill="#8a6210">Lesson: Find the Custom Implementations</text>
  </g>
  <path d="M760 235 L816 235" stroke="#8b8e9c" stroke-width="1.5" fill="none"/>
  <path d="M808 227 L820 235 L808 243" stroke="#8b8e9c" stroke-width="1.5" fill="none"/>
  <g>
    <rect x="820" y="150" width="320" height="170" rx="10" fill="#f8f1df" stroke="#8a6210" stroke-width="1.5"/>
    <text x="844" y="190" font-family="'IBM Plex Mono', Menlo, monospace" font-size="16" fill="#8a6210" letter-spacing="2">STEP 3</text>
    <text x="844" y="226" font-size="24" font-weight="600" fill="#0e1016">Create the offer from that</text>
    <text x="844" y="258" font-size="18" fill="#5a5d6b">One page. The loss, the fix, the price.</text>
    <text x="844" y="298" font-size="17" fill="#8a6210">Lesson: Write the Offer</text>
  </g>
  <text x="600" y="380" font-size="18" fill="#8b8e9c" text-anchor="middle">Strategy session and technical scope sit between step 2 and step 3.</text>
</svg>

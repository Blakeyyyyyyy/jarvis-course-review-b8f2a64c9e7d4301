<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="'Instrument Sans', Arial, sans-serif">
  <rect width="1200" height="520" fill="#ffffff"/>
  <text x="60" y="54" font-family="'Fraunces', Georgia, serif" font-size="26" font-weight="600" fill="#0e1016">The anchoring ladder. Each step is a yes. The last step is silence.</text>
  <!-- base bar: problem cost -->
  <rect x="60" y="100" width="1080" height="64" rx="10" fill="#0e1016"/>
  <text x="84" y="126" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#c9c3ef">THE PROBLEM, AGREED ON CALL ONE</text>
  <text x="84" y="152" font-size="20" fill="#ffffff">"This is costing you [problem cost] a year. Is that right?"   They say yes.</text>
  <!-- steps -->
  <rect x="60" y="200" width="1080" height="64" rx="10" fill="#efecfb" stroke="#4b2fc4" stroke-width="1.5"/>
  <text x="84" y="226" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#4b2fc4">STEP 1 · 10 PERCENT</text>
  <text x="84" y="252" font-size="20" fill="#0e1016">"If a fix cost 10 percent of that, would that be a smart investment?"   They say yes.</text>
  <rect x="160" y="290" width="980" height="64" rx="10" fill="#efecfb" stroke="#4b2fc4" stroke-width="1.5"/>
  <text x="184" y="316" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#4b2fc4">STEP 2 · NOT 7.5</text>
  <text x="184" y="342" font-size="20" fill="#0e1016">"I agree, 10 would be fair. I'm not charging 10. I'm not even charging 7.5."</text>
  <rect x="260" y="380" width="880" height="64" rx="10" fill="#f8f1df" stroke="#8a6210" stroke-width="1.5"/>
  <text x="284" y="406" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#8a6210">STEP 3 · 5 PERCENT, THEN SILENCE</text>
  <text x="284" y="432" font-size="20" fill="#0e1016">"5 percent, done in [x] days."  Then you wait. Do not speak.</text>
  <text x="60" y="495" font-size="16" fill="#8b8e9c">The number they hear last is a fraction of the number they already said yes to.</text>
</svg>

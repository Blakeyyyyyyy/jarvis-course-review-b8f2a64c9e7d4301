<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="'Instrument Sans', Arial, sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="60" y="54" font-family="'Fraunces', Georgia, serif" font-size="26" font-weight="600" fill="#0e1016">Six lines. That is the whole offer.</text>
  <text x="60" y="84" font-size="18" fill="#5a5d6b">Left: the line. Right: an example for a dental receptionist offer, made up to show the shape.</text>
  <!-- rows -->
  <g font-size="20">
    <rect x="60" y="110" width="330" height="80" rx="10" fill="#efecfb" stroke="#4b2fc4" stroke-width="1.5"/>
    <text x="80" y="140" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#4b2fc4">1  NICHE</text>
    <text x="80" y="170" font-size="18" fill="#5a5d6b">Who it is for, so they recognise themselves</text>
    <rect x="420" y="110" width="720" height="80" rx="10" fill="#fbfbfc" stroke="#e6e7ec" stroke-width="1.5"/>
    <text x="440" y="158" font-size="21" fill="#0e1016">Dental clinics with two or more chairs</text>

    <rect x="60" y="202" width="330" height="80" rx="10" fill="#efecfb" stroke="#4b2fc4" stroke-width="1.5"/>
    <text x="80" y="232" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#4b2fc4">2  OUTCOME</text>
    <text x="80" y="262" font-size="18" fill="#5a5d6b">The result they get, in their words</text>
    <rect x="420" y="202" width="720" height="80" rx="10" fill="#fbfbfc" stroke="#e6e7ec" stroke-width="1.5"/>
    <text x="440" y="250" font-size="21" fill="#0e1016">Every missed call answered and booked, day and night</text>

    <rect x="60" y="294" width="330" height="80" rx="10" fill="#efecfb" stroke="#4b2fc4" stroke-width="1.5"/>
    <text x="80" y="324" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#4b2fc4">3  TIMEFRAME</text>
    <text x="80" y="354" font-size="18" fill="#5a5d6b">By when. 14, 30, 60 or 90 days</text>
    <rect x="420" y="294" width="720" height="80" rx="10" fill="#fbfbfc" stroke="#e6e7ec" stroke-width="1.5"/>
    <text x="440" y="342" font-size="21" fill="#0e1016">Live in 14 days</text>

    <rect x="60" y="386" width="330" height="80" rx="10" fill="#efecfb" stroke="#4b2fc4" stroke-width="1.5"/>
    <text x="80" y="416" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#4b2fc4">4  RISK REVERSAL</text>
    <text x="80" y="446" font-size="18" fill="#5a5d6b">Money back, or you work free until it works</text>
    <rect x="420" y="386" width="720" height="80" rx="10" fill="#fbfbfc" stroke="#e6e7ec" stroke-width="1.5"/>
    <text x="440" y="434" font-size="21" fill="#0e1016">No new patient booked in 30 days, you pay nothing</text>

    <rect x="60" y="478" width="330" height="80" rx="10" fill="#efecfb" stroke="#4b2fc4" stroke-width="1.5"/>
    <text x="80" y="508" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#4b2fc4">5  AUTHORITY OR PROOF</text>
    <text x="80" y="538" font-size="18" fill="#5a5d6b">Why you. Results, or your method</text>
    <rect x="420" y="478" width="720" height="80" rx="10" fill="#fbfbfc" stroke="#e6e7ec" stroke-width="1.5"/>
    <text x="440" y="526" font-size="21" fill="#0e1016">Ring the demo line and hear it book you in</text>

    <rect x="60" y="570" width="330" height="80" rx="10" fill="#efecfb" stroke="#4b2fc4" stroke-width="1.5"/>
    <text x="80" y="600" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#4b2fc4">6  UNIQUE MECHANISM</text>
    <text x="80" y="630" font-size="18" fill="#5a5d6b">How it works, with a name</text>
    <rect x="420" y="570" width="720" height="80" rx="10" fill="#fbfbfc" stroke="#e6e7ec" stroke-width="1.5"/>
    <text x="440" y="618" font-size="21" fill="#0e1016">The After Hours Booking Agent, reads the clinic's live calendar</text>
  </g>
  <text x="60" y="682" font-size="16" fill="#8b8e9c">Illustrative example, not a client result.</text>
</svg>

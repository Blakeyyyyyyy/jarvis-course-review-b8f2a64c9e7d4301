<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="'Instrument Sans', Arial, sans-serif">
  <rect width="1200" height="560" fill="#ffffff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8b8e9c"/></marker></defs>
  <text x="60" y="54" font-family="'Fraunces', Georgia, serif" font-size="26" font-weight="600" fill="#0e1016">The build loop. One module at a time, every time.</text>
  <rect x="60" y="120" width="300" height="110" rx="10" fill="#efecfb" stroke="#4b2fc4" stroke-width="1.5"/>
  <text x="80" y="148" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#4b2fc4">STEP 1</text>
  <text x="80" y="180" font-size="22" font-weight="600" fill="#0e1016">Paste one module</text>
  <text x="80" y="206" font-size="18" fill="#5a5d6b">Its section of the plan, nothing else</text>
  <rect x="450" y="120" width="300" height="110" rx="10" fill="#efecfb" stroke="#4b2fc4" stroke-width="1.5"/>
  <text x="470" y="148" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#4b2fc4">STEP 2</text>
  <text x="470" y="180" font-size="22" font-weight="600" fill="#0e1016">Jarvis builds it</text>
  <text x="470" y="206" font-size="18" fill="#5a5d6b">On test data only</text>
  <rect x="840" y="120" width="300" height="110" rx="10" fill="#efecfb" stroke="#4b2fc4" stroke-width="1.5"/>
  <text x="860" y="148" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#4b2fc4">STEP 3</text>
  <text x="860" y="180" font-size="22" font-weight="600" fill="#0e1016">Run its test</text>
  <text x="860" y="206" font-size="18" fill="#5a5d6b">The acceptance test from the plan</text>
  <path d="M360 175 L440 175" stroke="#8b8e9c" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M750 175 L830 175" stroke="#8b8e9c" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <rect x="840" y="330" width="300" height="100" rx="10" fill="#f8f1df" stroke="#8a6210" stroke-width="1.5"/>
  <text x="860" y="358" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#8a6210">PASSED</text>
  <text x="860" y="390" font-size="22" font-weight="600" fill="#0e1016">Tick the build log</text>
  <text x="860" y="416" font-size="18" fill="#5a5d6b">Then the next module in plan order</text>
  <rect x="300" y="330" width="420" height="100" rx="10" fill="#ffffff" stroke="#e6e7ec" stroke-width="1.5"/>
  <text x="320" y="358" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#8b8e9c">FAILED</text>
  <text x="320" y="390" font-size="22" font-weight="600" fill="#0e1016">Tell Jarvis three things</text>
  <text x="320" y="416" font-size="18" fill="#5a5d6b">The input, what happened, what should have happened</text>
  <path d="M990 230 L990 320" stroke="#8b8e9c" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M840 380 L730 380" stroke="#8b8e9c" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M510 330 C510 280 600 240 600 240" stroke="#8b8e9c" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M990 430 C990 500 210 500 210 240" stroke="#8b8e9c" stroke-width="1.5" fill="none" stroke-dasharray="6 6" marker-end="url(#a)"/>
  <text x="60" y="530" font-size="20" fill="#5a5d6b">One change per message. If three things are wrong, that is three messages.</text>
</svg>

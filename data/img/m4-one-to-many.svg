<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="'Instrument Sans', Arial, sans-serif">
  <rect width="1200" height="520" fill="#ffffff"/>
  <text x="60" y="54" font-family="'Fraunces', Georgia, serif" font-size="26" font-weight="600" fill="#0e1016">Outreach is one to one. Ads are one to many.</text>
  <!-- left: outreach -->
  <text x="60" y="110" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#8b8e9c">OUTREACH</text>
  <rect x="60" y="130" width="470" height="330" rx="14" fill="#fbfbfc" stroke="#e6e7ec" stroke-width="1.5"/>
  <circle cx="150" cy="290" r="34" fill="#efecfb" stroke="#4b2fc4" stroke-width="2"/>
  <text x="150" y="297" text-anchor="middle" font-size="18" font-weight="600" fill="#0e1016">You</text>
  <line x1="190" y1="290" x2="390" y2="290" stroke="#4b2fc4" stroke-width="2.5"/>
  <polygon points="390,290 378,283 378,297" fill="#4b2fc4"/>
  <circle cx="430" cy="290" r="34" fill="#f8f1df" stroke="#8a6210" stroke-width="2"/>
  <text x="430" y="297" text-anchor="middle" font-size="15" font-weight="600" fill="#0e1016">Owner</text>
  <text x="295" y="372" text-anchor="middle" font-size="18" fill="#5a5d6b">One call. One owner. Then the next one.</text>
  <text x="295" y="402" text-anchor="middle" font-size="18" fill="#5a5d6b">Your week decides how many you reach.</text>
  <text x="295" y="440" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#8b8e9c">30 TO 50 A DAY, IF YOU DIAL</text>
  <!-- right: ads -->
  <text x="630" y="110" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#8b8e9c">ADS</text>
  <rect x="630" y="130" width="510" height="330" rx="14" fill="#fbfbfc" stroke="#e6e7ec" stroke-width="1.5"/>
  <rect x="690" y="240" width="90" height="100" rx="10" fill="#efecfb" stroke="#4b2fc4" stroke-width="2"/>
  <polygon points="722,275 722,305 750,290" fill="#4b2fc4"/>
  <text x="735" y="364" text-anchor="middle" font-size="16" font-weight="600" fill="#0e1016">One video</text>
  <g stroke="#4b2fc4" stroke-width="1.8">
    <line x1="780" y1="290" x2="880" y2="180"/><line x1="780" y1="290" x2="900" y2="225"/><line x1="780" y1="290" x2="910" y2="270"/>
    <line x1="780" y1="290" x2="910" y2="315"/><line x1="780" y1="290" x2="900" y2="360"/><line x1="780" y1="290" x2="880" y2="405"/>
  </g>
  <g fill="#f8f1df" stroke="#8a6210" stroke-width="1.5">
    <circle cx="900" cy="178" r="14"/><circle cx="920" cy="224" r="14"/><circle cx="930" cy="270" r="14"/>
    <circle cx="930" cy="316" r="14"/><circle cx="920" cy="361" r="14"/><circle cx="900" cy="407" r="14"/>
    <circle cx="990" cy="160" r="14"/><circle cx="1010" cy="205" r="14"/><circle cx="1030" cy="250" r="14"/>
    <circle cx="1035" cy="295" r="14"/><circle cx="1030" cy="340" r="14"/><circle cx="1010" cy="385" r="14"/><circle cx="990" cy="428" r="14"/>
    <circle cx="1080" cy="185" r="14"/><circle cx="1095" cy="230" r="14"/><circle cx="1105" cy="275" r="14"/><circle cx="1105" cy="320" r="14"/><circle cx="1095" cy="365" r="14"/><circle cx="1080" cy="410" r="14"/>
  </g>
  <text x="885" y="440" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#8b8e9c">HUNDREDS OF OWNERS, WHILE YOU SLEEP</text>
  <text x="600" y="496" text-anchor="middle" font-size="17" fill="#5a5d6b">Same message. Outreach says it once per owner. An ad says it to every owner Meta can find who looks like your buyer.</text>
</svg>

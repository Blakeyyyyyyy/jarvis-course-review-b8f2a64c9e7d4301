<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" font-family="'Instrument Sans', Arial, sans-serif">
  <rect width="1200" height="440" fill="#ffffff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8b8e9c"/></marker></defs>
  <text x="60" y="54" font-family="'Fraunces', Georgia, serif" font-size="26" font-weight="600" fill="#0e1016">Every demo is one of three shapes</text>
  <rect x="60" y="100" width="330" height="170" rx="10" fill="#efecfb" stroke="#4b2fc4" stroke-width="1.5"/>
  <text x="80" y="130" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#4b2fc4">RING IT</text>
  <text x="80" y="165" font-size="22" font-weight="600" fill="#0e1016">A number they can call</text>
  <text x="80" y="196" font-size="18" fill="#5a5d6b">Receptionist, missed calls,</text>
  <text x="80" y="222" font-size="18" fill="#5a5d6b">after hours answering</text>
  <rect x="435" y="100" width="330" height="170" rx="10" fill="#efecfb" stroke="#4b2fc4" stroke-width="1.5"/>
  <text x="455" y="130" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#4b2fc4">RECEIVE IT</text>
  <text x="455" y="165" font-size="22" font-weight="600" fill="#0e1016">A text that arrives</text>
  <text x="455" y="196" font-size="18" fill="#5a5d6b">Lead follow up, reviews,</text>
  <text x="455" y="222" font-size="18" fill="#5a5d6b">confirmations</text>
  <rect x="810" y="100" width="330" height="170" rx="10" fill="#efecfb" stroke="#4b2fc4" stroke-width="1.5"/>
  <text x="830" y="130" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#4b2fc4">WATCH IT</text>
  <text x="830" y="165" font-size="22" font-weight="600" fill="#0e1016">A two minute screen video</text>
  <text x="830" y="196" font-size="18" fill="#5a5d6b">CRM, lead gen system,</text>
  <text x="830" y="222" font-size="18" fill="#5a5d6b">AI employee, ads</text>
  <line x1="225" y1="270" x2="560" y2="330" stroke="#8b8e9c" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="600" y1="270" x2="600" y2="330" stroke="#8b8e9c" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="975" y1="270" x2="640" y2="330" stroke="#8b8e9c" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="330" y="340" width="540" height="70" rx="10" fill="#f8f1df" stroke="#8a6210" stroke-width="1.5"/>
  <text x="600" y="383" font-size="22" font-weight="600" fill="#0e1016" text-anchor="middle">They see their own business in it</text>
</svg>

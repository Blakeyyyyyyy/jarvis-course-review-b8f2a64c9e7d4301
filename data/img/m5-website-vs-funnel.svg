<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="'Instrument Sans', Arial, sans-serif">
  <rect width="1200" height="520" fill="#ffffff"/>
  <text x="60" y="54" font-family="'Fraunces', Georgia, serif" font-size="26" font-weight="600" fill="#0e1016">A website and a funnel do different jobs</text>

  <!-- website column -->
  <rect x="60" y="90" width="500" height="370" rx="10" fill="#fbfbfc" stroke="#d3d0e0" stroke-width="1.5"/>
  <text x="84" y="122" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#8b8e9c">WEBSITE</text>
  <text x="84" y="156" font-size="22" font-weight="600" fill="#0e1016">Brand awareness</text>
  <rect x="84" y="180" width="452" height="44" rx="8" fill="#ffffff" stroke="#e6e7ec" stroke-width="1.5"/>
  <text x="100" y="208" font-size="18" fill="#5a5d6b">Who you are, an overview of everything</text>
  <rect x="84" y="236" width="452" height="44" rx="8" fill="#ffffff" stroke="#e6e7ec" stroke-width="1.5"/>
  <text x="100" y="264" font-size="18" fill="#5a5d6b">Client logos, clients you have worked with</text>
  <rect x="84" y="292" width="452" height="44" rx="8" fill="#ffffff" stroke="#e6e7ec" stroke-width="1.5"/>
  <text x="100" y="320" font-size="18" fill="#5a5d6b">Many pages, many links, many exits</text>
  <rect x="84" y="348" width="452" height="44" rx="8" fill="#ffffff" stroke="#e6e7ec" stroke-width="1.5"/>
  <text x="100" y="376" font-size="18" fill="#5a5d6b">Top of funnel. Looks credible.</text>
  <text x="84" y="432" font-size="20" font-weight="600" fill="#8b8e9c">It does not sell.</text>

  <!-- funnel column -->
  <rect x="640" y="90" width="500" height="370" rx="10" fill="#efecfb" stroke="#4b2fc4" stroke-width="1.5"/>
  <text x="664" y="122" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#4b2fc4">FUNNEL / LANDING PAGE</text>
  <text x="664" y="156" font-size="22" font-weight="600" fill="#0e1016">One problem, one action</text>
  <rect x="664" y="180" width="452" height="44" rx="8" fill="#ffffff" stroke="#d3d0e0" stroke-width="1.5"/>
  <text x="680" y="208" font-size="18" fill="#5a5d6b">One specific problem you solve</text>
  <rect x="664" y="236" width="452" height="44" rx="8" fill="#ffffff" stroke="#d3d0e0" stroke-width="1.5"/>
  <text x="680" y="264" font-size="18" fill="#5a5d6b">The pain, spoken at its core</text>
  <rect x="664" y="292" width="452" height="44" rx="8" fill="#ffffff" stroke="#d3d0e0" stroke-width="1.5"/>
  <text x="680" y="320" font-size="18" fill="#5a5d6b">The mechanism, the proof you have</text>
  <rect x="664" y="348" width="452" height="44" rx="8" fill="#4b2fc4" stroke="#4b2fc4" stroke-width="1.5"/>
  <text x="680" y="376" font-size="18" font-weight="600" fill="#ffffff">One button: book the call</text>
  <text x="664" y="432" font-size="20" font-weight="600" fill="#4b2fc4">This is what sells.</text>

  <text x="60" y="500" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#8b8e9c">YOU CAN HAVE BOTH. ADS AND OUTREACH POINT AT THE FUNNEL, NEVER THE WEBSITE.</text>
</svg>

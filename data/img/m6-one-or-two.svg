<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="'Instrument Sans', Arial, sans-serif">
  <rect width="1200" height="420" fill="#ffffff"/>
  <text x="60" y="50" font-family="'Fraunces', Georgia, serif" font-size="26" font-weight="600" fill="#0e1016">One call or two? Your offer decides.</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8b8e9c"/></marker></defs>
  <rect x="60" y="90" width="520" height="290" rx="10" fill="#efecfb" stroke="#4b2fc4" stroke-width="1.5"/>
  <text x="84" y="122" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#4b2fc4">SPECIFIC OFFER</text>
  <text x="84" y="156" font-size="22" font-weight="600" fill="#0e1016">Receptionist, follow up system, pay per lead</text>
  <text x="84" y="186" font-size="18" fill="#5a5d6b">You already know the fix. Same build every time.</text>
  <g font-size="20" fill="#0e1016">
    <text x="84" y="236">1. Find the pain, get the number</text>
    <text x="84" y="272">2. "Give me a sec, I'll grab your proposal"</text>
    <text x="84" y="308">3. Jarvis brands the template while you talk</text>
    <text x="84" y="344" font-weight="600">4. Close on this call</text>
  </g>
  <rect x="620" y="90" width="520" height="290" rx="10" fill="#f8f1df" stroke="#8a6210" stroke-width="1.5"/>
  <text x="644" y="122" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#8a6210">CUSTOM BUILD</text>
  <text x="644" y="156" font-size="22" font-weight="600" fill="#0e1016">A CRM, a custom system, a bigger install</text>
  <text x="644" y="186" font-size="18" fill="#5a5d6b">You need to plan the whole build with your technical partner.</text>
  <g font-size="20" fill="#0e1016">
    <text x="644" y="236">1. Call one: find the pain, get the number</text>
    <text x="644" y="272">2. Two days: plan, scope, price, proposal</text>
    <text x="644" y="308">3. Call two: present, anchor, say the number</text>
    <text x="644" y="344" font-weight="600">4. Close on call two</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="'Instrument Sans', Arial, sans-serif">
  <rect width="1200" height="420" fill="#ffffff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8b8e9c"/></marker></defs>
  <rect x="60" y="150" width="240" height="120" rx="10" fill="#efecfb" stroke="#4b2fc4" stroke-width="1.5"/>
  <text x="80" y="195" font-size="22" font-weight="600" fill="#0e1016">Your six lines</text>
  <text x="80" y="226" font-size="18" fill="#5a5d6b">As written</text>
  <line x1="300" y1="210" x2="360" y2="210" stroke="#8b8e9c" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="370" y="60" width="460" height="300" rx="10" fill="#f8f1df" stroke="#8a6210" stroke-width="1.5"/>
  <text x="390" y="92" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#8a6210">THE CHECK</text>
  <text x="390" y="140" font-size="21" fill="#0e1016">1. Can it be built, in that timeframe</text>
  <text x="390" y="190" font-size="21" fill="#0e1016">2. What it costs to run each month</text>
  <text x="390" y="240" font-size="21" fill="#0e1016">3. What you can promise</text>
  <text x="390" y="290" font-size="21" fill="#0e1016">4. What you will not promise</text>
  <text x="390" y="335" font-size="17" fill="#5a5d6b">Your technical CSM, the strategy session, or Jarvis with the scoping skill</text>
  <line x1="830" y1="210" x2="890" y2="210" stroke="#8b8e9c" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="900" y="150" width="240" height="120" rx="10" fill="#efecfb" stroke="#4b2fc4" stroke-width="1.5"/>
  <text x="920" y="195" font-size="22" font-weight="600" fill="#0e1016">A checked offer</text>
  <text x="920" y="226" font-size="18" fill="#5a5d6b">Build and promise agreed</text>
</svg>

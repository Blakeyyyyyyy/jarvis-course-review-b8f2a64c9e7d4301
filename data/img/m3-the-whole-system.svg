<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="'Instrument Sans', Arial, sans-serif">
  <rect width="1200" height="560" fill="#ffffff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8b8e9c"/></marker></defs>
  <text x="60" y="54" font-family="'Fraunces', Georgia, serif" font-size="26" font-weight="600" fill="#0e1016">One list, one message, every channel. Jarvis does steps 1 to 5. You do 6.</text>
  <!-- row 1: three boxes -->
  <rect x="60" y="110" width="330" height="120" rx="10" fill="#efecfb" stroke="#4b2fc4" stroke-width="1.5"/>
  <text x="80" y="138" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#4b2fc4">1. THE ACCOUNT</text>
  <text x="80" y="170" font-size="22" font-weight="600" fill="#0e1016">Who exactly you want</text>
  <text x="80" y="198" font-size="18" fill="#5a5d6b">Industry, place, size, the pain</text>
  <line x1="390" y1="170" x2="430" y2="170" stroke="#8b8e9c" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="435" y="110" width="330" height="120" rx="10" fill="#efecfb" stroke="#4b2fc4" stroke-width="1.5"/>
  <text x="455" y="138" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#4b2fc4">2. THE LIST</text>
  <text x="455" y="170" font-size="22" font-weight="600" fill="#0e1016">Google Maps, 300 businesses</text>
  <text x="455" y="198" font-size="18" fill="#5a5d6b">Name, phone, website, reviews, hours</text>
  <line x1="765" y1="170" x2="805" y2="170" stroke="#8b8e9c" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="810" y="110" width="330" height="120" rx="10" fill="#efecfb" stroke="#4b2fc4" stroke-width="1.5"/>
  <text x="830" y="138" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#4b2fc4">3. READ EVERY SITE</text>
  <text x="830" y="170" font-size="22" font-weight="600" fill="#0e1016">Owner, email, pain signs</text>
  <text x="830" y="198" font-size="18" fill="#5a5d6b">No booking, no after hours, job ads</text>
  <!-- down arrow -->
  <line x1="975" y1="230" x2="975" y2="270" stroke="#8b8e9c" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- row 2: three boxes right to left -->
  <rect x="810" y="275" width="330" height="120" rx="10" fill="#efecfb" stroke="#4b2fc4" stroke-width="1.5"/>
  <text x="830" y="303" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#4b2fc4">4. THE OWNER</text>
  <text x="830" y="335" font-size="22" font-weight="600" fill="#0e1016">Free business registry</text>
  <text x="830" y="363" font-size="18" fill="#5a5d6b">ABN, Companies House, state records</text>
  <line x1="805" y1="335" x2="765" y2="335" stroke="#8b8e9c" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="435" y="275" width="330" height="120" rx="10" fill="#efecfb" stroke="#4b2fc4" stroke-width="1.5"/>
  <text x="455" y="303" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#4b2fc4">5. RANK AND WRITE</text>
  <text x="455" y="335" font-size="22" font-weight="600" fill="#0e1016">Top 30, one message</text>
  <text x="455" y="363" font-size="18" fill="#5a5d6b">Call script, email, LinkedIn note, DM</text>
  <line x1="430" y1="335" x2="390" y2="335" stroke="#8b8e9c" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="60" y="275" width="330" height="120" rx="10" fill="#f8f1df" stroke="#8a6210" stroke-width="1.5"/>
  <text x="80" y="303" font-family="'IBM Plex Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#8a6210">6. YOU RUN IT</text>
  <text x="80" y="335" font-size="22" font-weight="600" fill="#0e1016">Dial, email, connect, DM</text>
  <text x="80" y="363" font-size="18" fill="#5a5d6b">Three touches a week, three weeks</text>
  <!-- outcome -->
  <line x1="225" y1="395" x2="225" y2="435" stroke="#8b8e9c" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="60" y="440" width="1080" height="70" rx="10" fill="#ffffff" stroke="#e6e7ec" stroke-width="1.5"/>
  <text x="80" y="483" font-size="22" font-weight="600" fill="#0e1016">Booked first calls in your CRM. Any reply or opt out stops the sequence on every channel.</text>
  <text x="60" y="545" font-size="16" fill="#8b8e9c">Cost: nothing but your time. Paid data tools come later, only when you are past a few hundred accounts a month.</text>
</svg>

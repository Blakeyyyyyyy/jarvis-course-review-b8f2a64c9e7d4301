<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="'Instrument Sans', Arial, sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="60" y="58" font-family="'Fraunces', Georgia, serif" font-size="30" font-weight="600" fill="#0e1016">Where a desired market lives</text>
  <text x="60" y="92" font-size="20" fill="#5a5d6b">Pain in dollars on one axis, ability and willingness to pay on the other. You want the top right, and only the top right.</text>
  <!-- axes -->
  <line x1="200" y1="140" x2="200" y2="600" stroke="#5a5d6b" stroke-width="1.5"/>
  <line x1="200" y1="600" x2="1100" y2="600" stroke="#5a5d6b" stroke-width="1.5"/>
  <text x="650" y="650" font-size="17" fill="#8b8e9c" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, monospace">ABILITY AND WILLINGNESS TO PAY  →</text>
  <text x="150" y="370" font-size="17" fill="#8b8e9c" text-anchor="middle" font-family="'IBM Plex Mono', Menlo, monospace" transform="rotate(-90 150 370)">PAIN IN DOLLARS  →</text>
  <!-- quadrants -->
  <rect x="210" y="150" width="440" height="220" rx="10" fill="#fbfbfc" stroke="#e6e7ec" stroke-width="1.5"/>
  <text x="234" y="186" font-size="22" font-weight="600" fill="#0e1016">Bleeding, but broke</text>
  <text x="234" y="216" font-size="17" fill="#5a5d6b">Real pain, no budget. Hard sales, slow pay,</text>
  <text x="234" y="242" font-size="17" fill="#5a5d6b">and they churn the moment cash gets tight.</text>
  <rect x="660" y="150" width="430" height="220" rx="10" fill="#efecfb" stroke="#4b2fc4" stroke-width="2"/>
  <text x="684" y="186" font-size="22" font-weight="600" fill="#4b2fc4">Desired market</text>
  <text x="684" y="216" font-size="17" fill="#0e1016">Pain costs real money and they can pay to stop it.</text>
  <text x="684" y="242" font-size="17" fill="#0e1016">Usually already paying staff or software for it.</text>
  <text x="684" y="268" font-size="17" fill="#0e1016">Five figure deals happen here.</text>
  <rect x="210" y="380" width="440" height="210" rx="10" fill="#fbfbfc" stroke="#e6e7ec" stroke-width="1.5"/>
  <text x="234" y="416" font-size="22" font-weight="600" fill="#0e1016">Nothing here</text>
  <text x="234" y="446" font-size="17" fill="#5a5d6b">No pain, no money. Walk past it.</text>
  <rect x="660" y="380" width="430" height="210" rx="10" fill="#f8f1df" stroke="#e6e7ec" stroke-width="1.5"/>
  <text x="684" y="416" font-size="22" font-weight="600" fill="#0e1016">Rich and comfortable</text>
  <text x="684" y="446" font-size="17" fill="#5a5d6b">Can pay, does not need to. "Nice idea, not now."</text>
  <text x="684" y="472" font-size="17" fill="#5a5d6b">Only moves if you find a problem they are</text>
  <text x="684" y="498" font-size="17" fill="#5a5d6b">not yet counting. Sometimes you can.</text>
</svg>
